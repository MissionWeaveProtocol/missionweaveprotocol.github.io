name: Publish website

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    concurrency:
      group: site-build-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - id: pages
        uses: actions/configure-pages@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
        env:
          SITE_BASE: ${{ steps.pages.outputs.base_path }}
          SITE_URL: ${{ steps.pages.outputs.origin }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  release-sources:
    name: Verify exact release sources
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check out pinned protocol and SDK sources
        run: >-
          node scripts/checkout-normative-sources.mjs --sources-root
          "$RUNNER_TEMP/missionweaveprotocol-sources"
      - name: Reject source destination symlinks
        run: >-
          npm run test:sources-checkout-paths -- --mirror-root
          "$RUNNER_TEMP/missionweaveprotocol-sources"
      - name: Verify exact release sources
        run: npm run check:release-sources
        env:
          MW_SOURCES_ROOT: ${{ runner.temp }}/missionweaveprotocol-sources

  deploy:
    name: Deploy Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build, release-sources]
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
